<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8e8e3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14140f" />
  <meta name="description"
    content="Portafolio en React de Duver Betancur: desarrollo full stack, automatización y ciberseguridad." />
  <title>Duver Betancur – Desarrollador de Software</title>
  <link rel="preload" href="%BASE_URL%fonts/BodoniModa-latin.woff2" as="font" type="font/woff2"
    crossorigin />
  <link rel="preload" href="%BASE_URL%fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <script>
    (function () {
      const STORAGE_KEY = 'theme';
      const persisted = window.localStorage.getItem(STORAGE_KEY);
      // Claro como principal: solo se arranca en dark con guardado explícito.
      const theme = persisted === 'dark' ? 'dark' : 'light';
      const root = document.documentElement;
      root.classList.toggle('dark', theme === 'dark');
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
    })();
  </script>
</head>

<body class="overflow-x-hidden scrollbar-thin bg-ground text-ink">
  <div id="root"></div>
  <!--
    Esta app es una SPA de React sin SSR: sin JavaScript no se dibuja nada. El
    `<noscript>` sólo puede venir del HTML, no de React. Sus clases entran por el
    `<link>` estático del CSS, así que funcionan sin script.
  -->
  <noscript>
    <div class="mx-auto max-w-[var(--shell-max)] px-[var(--pad-x)] py-[var(--space-section)] text-ink">
      <h1 class="t-monument">DUVER BETANCUR</h1>
      <p class="t-lead">Esta página se compone con JavaScript: sin él no se dibuja el archivo de 24 proyectos. Las salidas honestas siguen a un clic.</p>
      <ul class="t-body">
        <li><a class="u-link" href="https://github.com/Duver0">Perfil en GitHub · 24 repositorios</a></li>
        <li><a class="u-link" href="mailto:duverbetancurbedoya@outlook.com">duverbetancurbedoya@outlook.com</a></li>
        <li><a class="u-link" href="%BASE_URL%DuverBetancurCV.pdf">Descargar CV (PDF)</a></li>
      </ul>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
